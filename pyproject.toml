[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsbg-self-play"
version = "0.1.0"
description = "Configurable Hearthstone Battlegrounds simulation research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.24", "ruff>=0.11"]
rl = ["numpy>=1.24", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["hsbg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
